; One PlatformIO project for the IDE. Firmware stays in its own folder.
; Pick the environment in the status bar: remote_s3, receiver_c3, or teensy40.

[platformio]
src_dir = .
default_envs = remote_s3, receiver_c3, teensy40

[env]
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/common
    -DSIREN_DEBUG=1
    -DSIREN_DEBUG_VERBOSE=0

[env:remote_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<remote_s3/src/*.cpp> +<remote_s3/src/*.c>
extra_scripts = pre:remote_s3/cxx_std.py
build_flags =
    ${env.build_flags}
    -I${PROJECT_DIR}/remote_s3/src
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

[env:receiver_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<receiver_c3/src/*.cpp>
build_flags =
    ${env.build_flags}
    -I${PROJECT_DIR}/receiver_c3/src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_src_filter = +<teensy_audio/src/*.cpp>
build_flags =
    ${env.build_flags}
    -I${PROJECT_DIR}/teensy_audio/src
