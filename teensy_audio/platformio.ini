; Audio controller target. Teensy 4.0 + Audio Shield Rev D.
; The PJRC Audio library and SD library ship with the Teensy platform.

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../common
    -DSIREN_DEBUG=1
    -DSIREN_DEBUG_VERBOSE=0
