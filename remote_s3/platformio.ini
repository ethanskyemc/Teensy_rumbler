; Remote UI: Waveshare ESP32-S3-AMOLED-1.91.
; 16 MB quad flash. The 8 MB PSRAM is octal and its data pins are GPIO33-37,
; which are also the keypad LED SPI pins, so octal PSRAM stays off.
; The board id stays a generic S3 target. USB CDC is the USB-C port.

[env:remote_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:cxx_std.py

board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../common
    -DSIREN_DEBUG=1
    -DSIREN_DEBUG_VERBOSE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
