; Remote UI: Waveshare ESP32-S3-AMOLED-1.91.
; 16 MB quad flash and 8 MB octal PSRAM (N16R8). qio_opi is that combination.
; The board id stays a generic S3 target; memory settings below are the real ones.
; USB CDC is the board's USB-C port. UART0 on GPIO43/44 is the header, not USB.

[env:remote_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:cxx_std.py

board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../common
    -DSIREN_DEBUG=1
    -DSIREN_DEBUG_VERBOSE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
