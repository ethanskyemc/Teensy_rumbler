; Wireless bridge. Pinout matches the ESP32-C3 Super Mini style board:
; GPIO20 = RX, GPIO21 = TX. Those are UART0.
; USB CDC keeps debug logs off that UART so the Teensy link owns it.

[env:receiver_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../common
    -DSIREN_DEBUG=1
    -DSIREN_DEBUG_VERBOSE=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
